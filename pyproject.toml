[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regressa"
version = "0.1.0"
description = "Prompt evaluation and regression-testing suite for LLM applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Regressa contributors" }]
keywords = ["llm", "eval", "regression", "testing", "anthropic", "claude", "prompt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

dependencies = [
  "anthropic>=0.69",
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
# Semantic-similarity assertions need a local embedding model: the Anthropic API
# has no embeddings endpoint, so this cannot be provided by the default install.
similarity = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
regressa = "regressa.cli:app"

[project.urls]
Homepage = "https://github.com/bluxo1/Regressa"
Documentation = "https://bluxo1.github.io/Regressa/"
Issues = "https://github.com/bluxo1/Regressa/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/regressa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  # Tests needing the `similarity` extra and a real embedding model. They skip
  # automatically when it isn't installed; `-m 'not slow'` skips them anyway.
  "slow: requires a local embedding model (the `similarity` extra)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
