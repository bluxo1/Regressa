# A suite that runs with no API key and no cost, using the mock provider!
#
#   # 1. Record a known-good baseline.
#   regressa run suites/offline-demo.yaml --set-baseline
#
#   # 2. Degrade one behaviour and watch it get caught! (exits 1).
#   regressa run suites/offline-demo.yaml \
#     --var greeting_reply="As an AI language model, I cannot assist with that."
#
# Note the shape of this: there is ONE target, `agent`, and what changes between
# runs is its behaviour. That matters — a regression is defined per (case, target)
# pair, so comparing two *different* target ids yields `added` / `removed` rows
# rather than regressions. Real use works the same way: you keep the target id
# and edit the prompt, model, or system instruction underneath it. Here the
# `*_reply` variables stand in for that edit so the workflow is demonstrable
# offline. The mock provider renders its responses through the same {{ }}
# templating as prompts, which is what makes the override work.

name: offline-demo
description: End-to-end walkthrough of Regressa using the deterministic mock provider.

vars:
  product: Northwind Lamp

  # Known-good fixture responses. Override any of these with --var to simulate
  # a behaviour change.
  greeting_reply: "Hello! How can I help you with your Northwind Lamp today?"
  json_reply: '{"order_id": "A-1", "intent": "status"}'
  budget_reply: "Refunds are available within 30 days of delivery."

targets:
  - id: agent
    provider: mock
    model: mock-1
    options:
      latency_ms: 2
      by_case:
        greeting: "{{ greeting_reply }}"
        json-shape: "{{ json_reply }}"
        word-budget: "{{ budget_reply }}"

cases:
  - id: greeting
    tags: [tone]
    prompt: "Hi, I need help with my {{ product }}."
    assertions:
      - type: contains
        label: names the product
        value: "Northwind Lamp"
      - type: not_contains
        label: no AI boilerplate
        value: ["As an AI", "I cannot assist"]

  - id: json-shape
    tags: [structured]
    prompt: "Reply with JSON: order_id and intent."
    assertions:
      - type: json_valid
      - type: json_path
        label: classified as a status query
        path: intent
        equals: status

  - id: word-budget
    tags: [tone]
    prompt: "How long do I have to return something?"
    assertions:
      - type: contains
        value: ["30 day", "30-day"]
        mode: any
      - type: length
        label: stays brief
        unit: words
        max: 40
